name: Release

# 触发：
# - 推 v* tag（如 v0.1.0）→ 自动 build + 上传到 Release
# - 手动 dispatch → 用 input 指定 tag，方便测试
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write  # 创建 Release + 上传 assets 需要

jobs:
  release:
    name: Build + Release (macOS)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache Electron prebuilt
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # macOS 自带 clang + Xcode CLT，能编 ObjC sidecar；hdiutil 用来打 DMG
      - name: Build (sidecar + Vue + Electron + DMG)
        run: pnpm build
        env:
          # ad-hoc 签名，跳过 Apple Developer 流程
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List artifacts
        run: ls -la release/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release/*.dmg
            release/*.dmg.blockmap
