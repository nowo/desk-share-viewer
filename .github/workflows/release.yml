name: Release

# 触发：
# - 推 v* tag（如 v0.1.0）→ 自动 build + 上传到 Release
# - 手动 dispatch → 用 input 指定 tag，方便测试
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write  # 创建 Release + 上传 assets 需要

jobs:
  # 三平台并行 build，各自上传自己的产物到同一个 Release
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifacts: |
              release/*.dmg
              release/*.dmg.blockmap
          - os: windows-latest
            artifacts: |
              release/*.exe
              release/*.exe.blockmap
          - os: ubuntu-latest
            artifacts: |
              release/*.AppImage
              release/*.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # 生成 changelog 需要完整 git 历史 + 所有 tag
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron prebuilt
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # macOS 自带 clang + Xcode CLT，能编 ObjC sidecar
      # Windows / Linux 上 prep-sidecars.mjs 会直接 exit 0 跳过
      - name: Build
        run: pnpm build
        env:
          # ad-hoc 签名，跳过 Apple Developer 流程
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List artifacts
        shell: bash
        run: ls -la release/

      # 只在 macOS 上生成一次 release notes（任一 runner 都行，跨平台只需要一份）
      - name: Generate release notes
        if: matrix.os == 'macos-latest'
        run: |
          set -e
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PREV=$(git tag --sort=-version:refname --list 'v*' | grep -vx "$TAG" | head -1 || true)
          rm -f release-notes.md release-changes.md
          if [ -n "$PREV" ]; then
              pnpm exec changelogen --from "$PREV" --to "$TAG" -o release-changes.md || true
          else
              pnpm exec changelogen --to "$TAG" -o release-changes.md || true
          fi
          touch release-changes.md
          {
              cat build/release-header.md
              echo ""
              cat release-changes.md
          } > release-notes.md
          echo "=== generated release notes ==="
          cat release-notes.md

      # 每个 runner 都上传自己的产物到同一个 Release（softprops 自动 merge 同 tag）
      # macOS runner 额外带上 release notes 作为 body
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: ${{ matrix.os == 'macos-latest' && 'release-notes.md' || '' }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: ${{ matrix.artifacts }}
